<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LeadQualifier — demo intake</title>
<style>
body{font-family:system-ui,-apple-system,sans-serif;max-width:640px;margin:2rem auto;padding:0 1rem;color:#1a1a1a;background:#fafafa}
.card{background:#fff;border:1px solid #e5e5e5;border-radius:12px;padding:2rem;box-shadow:0 2px 8px rgba(0,0,0,.04)}
h1{font-size:1.5rem;margin:0 0 .25rem} p.sub{color:#666;margin:0 0 1.5rem}
label{display:block;font-weight:600;margin:.9rem 0 .3rem;font-size:.9rem}
input,select,textarea{width:100%;padding:.6rem .7rem;border:1px solid #ccc;border-radius:8px;font-size:1rem;box-sizing:border-box}
textarea{min-height:110px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
button{margin-top:1.4rem;background:#111;color:#fff;border:0;border-radius:8px;padding:.8rem 1.6rem;font-size:1rem;cursor:pointer}
button:hover{background:#333}
.hint{font-size:.8rem;color:#888;margin-top:1rem}
</style></head>
<body><div class="card">
<h1>Get a quote for workflow automation</h1>
<p class="sub">Demo intake form — submitting runs the live LeadQualifier pipeline:
enrich → AI score (BANT) → smart routing.</p>
<form method="post" action="/api/intake">
<div class="row">
<div><label>Name *</label><input name="name" required placeholder="Jane Doe"></div>
<div><label>Work email *</label><input name="email" type="email" required placeholder="jane@acmerealty.com"></div>
</div>
<div class="row">
<div><label>Company</label><input name="company" placeholder="Acme Realty Group"></div>
<div><label>Your role</label><input name="role" placeholder="Founder"></div>
</div>
<div class="row">
<div><label>Budget range</label><select name="budget_range">
<option value="">Select…</option><option>Under $1k</option><option>$1k – $3k</option>
<option>$3k – $10k</option><option>$10k+</option><option>Not sure yet</option></select></div>
<div><label>Timeline</label><select name="timeline">
<option value="">Select…</option><option>ASAP / this month</option><option>This quarter</option>
<option>Just researching</option></select></div>
</div>
<label>What eats your team's time?</label>
<textarea name="message" placeholder="e.g. New inquiries sit in Gmail for hours before anyone replies, and we lose track of follow-ups…"></textarea>
<button type="submit">Request quote</button>
<p class="hint">Demo only — no data leaves this machine. Try a hot lead (founder, urgent pain)
vs. a vague one and watch the routing differ.</p>
</form></div></body></html>
